<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip History</title><link rel="stylesheet" href="/static/style.css"><nav><b>✈ AI Travel Planner</b><span><a href="/dashboard">Dashboard</a><a href="/history">History</a><a href="/logout">Logout</a></span></nav><main><h1>Trip History</h1>{% for t in trips %}<section class="card"><h2>{{t.destination}}</h2><p>{{t.days}} days · ₹{{'%.2f'|format(t.budget)}} · {{t.created_at}}</p><details><summary>View itinerary</summary><pre>{{t.itinerary}}</pre></details></section>{% else %}<section class="card">No trips saved yet.</section>{% endfor %}</main>
